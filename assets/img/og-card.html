<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Karla:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FBF9F5;--ink:#1F1815;--muted:#5C514A;--brand:#B5462E;--gold:#EEB44D;--gold-soft:#F4D08F;--line:#E8DFD4;}
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px}
  body{background:var(--paper);font-family:Karla,sans-serif;color:var(--ink);
       display:flex;flex-direction:column;justify-content:space-between;padding:64px 72px 58px;overflow:hidden}
  .logo{font-family:'Playfair Display',serif;font-size:40px;font-weight:700;line-height:1}
  .logo b{color:var(--brand)} .logo i{color:#D19A28;font-style:normal}
  h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:92px;line-height:.98;
     letter-spacing:-.04em;max-width:15.5ch;margin-top:6px}
  h1 em{font-style:normal;box-shadow:inset 0 -.16em 0 var(--gold-soft)}
  p{font-size:29px;line-height:1.42;color:var(--muted);max-width:30ch;margin-top:26px}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:24px;
        border-top:3px solid var(--ink);padding-top:22px}
  .foot span{font-size:25px;font-weight:700;color:var(--ink)}
  .foot small{font-size:20px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--brand)}
  .mid{flex:1;display:flex;flex-direction:column;justify-content:center}
</style></head><body>
  <div class="logo"><b>Be</b><i>Held</i></div>
  <div class="mid">
    <h1>Your always-on <em>customer finder</em>.</h1>
    <p>It finds people who might buy what you made, and tells you which way of reaching them worked.</p>
  </div>
  <div class="foot"><span>beheld.tech</span><small>Start free</small></div>
</body></html>
